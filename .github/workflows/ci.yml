name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  rpc-corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rpc-corpus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/rpc-corpus/package-lock.json
      - run: npm ci --ignore-scripts --no-fund
      - run: npm test
  test:
    name: Build & Test
    strategy:
      matrix:
        go: ["1.22.2", "stable"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...


      - name: Build
        run: go build ./...
