name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    strategy:
      matrix:
        go: ["1.22.2", "stable"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...


      - name: Build
        run: go build ./...
